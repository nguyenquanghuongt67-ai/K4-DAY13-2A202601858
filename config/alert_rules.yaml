alerts:
  - name: ai_api_latency_breach
    severity: warning
    condition: "latency_p95_ms > 3000 for 10m"
    type: symptom-based
    owner: platform-oncall
    runbook: docs/alerts.md#alert-1
  - name: ai_api_error_rate_breach
    severity: critical
    condition: "error_rate_pct > 2 for 5m"
    type: symptom-based
    owner: platform-oncall
    runbook: docs/alerts.md#alert-2
  - name: ai_api_quality_or_cost_breach
    severity: warning
    condition: "quality_score_avg < 0.75 or daily_cost_usd > 2.5"
    type: symptom-based
    owner: ai-platform
    runbook: docs/alerts.md#alert-3
