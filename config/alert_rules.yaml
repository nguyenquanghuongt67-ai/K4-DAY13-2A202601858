alerts:
  - name: High_Latency
    severity: warning
    condition: p95_latency_ms > 3000
    type: symptom-based
    owner: SRE_Team
    runbook: docs/alerts.md#alert-1
  - name: High_Error_Rate
    severity: critical
    condition: error_rate_pct > 2
    type: symptom-based
    owner: SRE_Team
    runbook: docs/alerts.md#alert-2
  - name: High_Cost
    severity: warning
    condition: total_cost_usd > 2.5
    type: symptom-based
    owner: FinOps_Team
    runbook: docs/alerts.md#alert-3
